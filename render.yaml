services:
  - type: web
    name: perfumeria-darcy
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn perfumeria.wsgi:application"
    autoDeploy: true

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: perfumeria.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: perfumeria-db
          property: connectionString