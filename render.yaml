services:
  # Web Service con Docker
  - type: web
    name: perfumeria-darcy
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    
    # Environment Variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DJANGO_SETTINGS_MODULE
        value: perfumeria.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: EMAIL_HOST_USER
        value: gilbertandeliz04@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: gvwa fiqu giim fyiw
      - key: DEFAULT_FROM_EMAIL
        value: noreply@perfumeria.com
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
    
    # Health Check
    healthCheckPath: /
    
    # Static Files
    staticDir: staticfiles
    mountPath: /static

  # Database (PostgreSQL)
  - type: pserv
    name: perfumeria-db
    plan: free
    env: postgres
    
    # Database Environment Variables
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: perfumeria-db
          property: connectionString
