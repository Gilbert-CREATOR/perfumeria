{% extends 'base_moderno.html' %}
{% load static %}

{% block title %}Pago Cancelado - Perfumería Premium{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="text-center">
                <div class="mb-4">
                    <i class="fas fa-times-circle text-warning" style="font-size: 4rem;"></i>
                </div>
                <h2 class="mb-3">Pago Cancelado</h2>
                <p class="text-muted mb-4">
                    El proceso de pago fue cancelado. No se ha realizado ningún cargo.
                </p>
                
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'checkout' %}" class="btn btn-primary">
                        <i class="fas fa-redo me-2"></i> Intentar Pago Nuevamente
                    </a>
                    <a href="{% url 'ver_carrito' %}" class="btn btn-outline-secondary">
                        <i class="fas fa-shopping-cart me-2"></i> Ver Carrito
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
